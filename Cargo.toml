[workspace]
resolver = "2"
members = ["src-tauri", "crates/*"]

[workspace.package]
edition = "2021"
version = "0.3.0"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", features = ["serde"] }
rayon = "1"
tempfile = "3"
sha2 = "0.10"
hex = "0.4"
regex = "1"
toml_edit = "0.25"
trash = "5"
ureq = "3"
memchr = "2"
ignore = "0.4"
dirs = "6"
once_cell = "1"

# macOS 27 的 dyld 会拒绝加载被 strip 过的过程宏动态库（mis-aligned LINKEDIT string pool），
# 而 cargo 在 release 下默认 strip = "debuginfo"。关掉它。
[profile.release]
strip = false
